services:
  postgres:
    container_name: airflow_db
    image: postgres:14
    env_file: .env.postgres
    volumes:
      - ./database/:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always

  airflow-init:
    container_name: airflow_init
    build:
      context: .
      target: airflow
    command: poetry run scripts/airflow-init.sh
    env_file:
      - ../.env
      - .env.airflow
      - .env.postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
    restart: "no"
  
  scheduler:
    container_name: airflow_scheduler
    build: 
      context: .
      target: airflow
    command: poetry run airflow scheduler
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "poetry run airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: 
      - ../.env
      - .env.airflow
    environment:
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://webserver:8080/execution/
      - AIRFLOW__DEBUG__FAIL_FAST=true
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
      - ~/.gcp_keys/thelook-gcp-airflow.json:/app/airflow/keys/gcp-service-account.json
    tty: true
    stdin_open: true

  dag-processor:
    container_name: airflow_dag_processor
    build:
      context: .
      target: airflow
    command: poetry run airflow dag-processor
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: 
      - .env.airflow
      - ../.env
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
      - ~/.gcp_keys/thelook-gcp-airflow.json:/app/airflow/keys/gcp-service-account.json

  webserver:
    container_name: airflow_webserver
    build: 
      context: .
      target: airflow
    command: poetry run scripts/start-api.sh
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: 
        - path: .env.postgres
        - path: .env.airflow
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    tty: true
    stdin_open: true

