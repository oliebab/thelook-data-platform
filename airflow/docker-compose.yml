services:
  postgres:
    container_name: airflow_db
    image: postgres:14
    env_file: .env.postgres
    volumes:
      - ./database/:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$AIRFLOW_DB_NAME -U $$AIRFLOW_DB_USER || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always

  airflow-init:
    container_name: airflow_init
    build:
      context: .
      target: airflow
    command: poetry run scripts/entrypoint.sh
    env_file:
      - .env.airflow
      - .env.postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - GCP_PROJECT=$GCP_PROJECT
      - GCS_BUCKET=$GCS_BUCKET
      - BQ_LOCATION=$BQ_LOCATION
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
    restart: "no"
  
  scheduler:
    container_name: airflow_scheduler
    build: 
      context: .
      target: airflow
    command: poetry run airflow scheduler
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "poetry run airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: .env.airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://webserver:8080/execution/
      - AIRFLOW__DEBUG__FAIL_FAST=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - GCP_PROJECT=$GCP_PROJECT
      - GCS_BUCKET=$GCS_BUCKET
      - BQ_LOCATION=$BQ_LOCATION
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
    tty: true
    stdin_open: true

  dag-processor:
    container_name: airflow_dag_processor
    build:
      context: .
      target: airflow
    command: poetry run airflow dag-processor
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env.airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - GCP_PROJECT=$GCP_PROJECT
      - GCS_BUCKET=$GCS_BUCKET
      - BQ_LOCATION=$BQ_LOCATION
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs

  webserver:
    container_name: airflow_webserver
    build: 
      context: .
      target: airflow
    command: poetry run airflow api-server
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: 
        - path: .env.airflow
        - path: .env.postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./dags:/app/airflow/dags
      - ./data:/app/airflow/data
      - ./logs:/app/airflow/logs
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    tty: true
    stdin_open: true

