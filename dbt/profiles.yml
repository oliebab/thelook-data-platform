thelook:
  outputs:
    prod:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('DBT_KEYFILE', '/app/keys/gcp-service-account.json') }}"
      project: "{{ env_var('GCP_PROJECT', 'thelook-dp-2611') }}"
      dataset: "{{ env_var('DBT_DATASET', 'analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 300
  target: prod
