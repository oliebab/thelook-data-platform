version: 2

models:
  - name: fct_orders
    description: "One row per order. Amounts are summed from fct_order_items. user_order_number ranks a customer's non-cancelled orders by date (NULL for cancelled orders)."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: user_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Processing', 'Shipped', 'Complete', 'Cancelled', 'Returned']
      - name: order_week
        data_tests: [not_null]
      - name: is_first_order
        description: "TRUE for a customer's first non-cancelled order. Drives new_buyers."