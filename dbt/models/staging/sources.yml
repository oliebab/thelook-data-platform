version: 2

sources:
  - name: thelook_raw
    description: Raw TheLook tables loaded daily by the ingestion CLI (one partition per dt).
    database: thelook-dp-2611
    schema: raw_thelook
    loaded_at_field: _ingested_at
    freshness:
      warn_after: {count: 26, period: hour}
      error_after: {count: 50, period: hour}
    tables:
      - name: orders
        description: Daily full snapshot of orders.
      - name: order_items
        description: Daily full snapshot of order items.
      - name: users
        description: Daily full snapshot of users (user_geom excluded at ingestion).
      - name: products
        description: Daily full snapshot of products.
      - name: events
        description: Website events, one partition per event day (staged by Olivier).
