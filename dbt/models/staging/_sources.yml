version: 2

sources:
  - name: thelook_raw
    database: "{{ env_var('GCP_PROJECT', 'thelook-dp-2611') }}"
    schema:  "{{ env_var('RAW_DATASET', 'raw_thelook') }}"
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: events
      - name: orders
      - name: order_items
      - name: users
      - name: products
