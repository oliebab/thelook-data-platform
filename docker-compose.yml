services:
  postgres:
    container_name: airflow_db
    image: postgres:14
    env_file: ./airflow/.env.postgres
    volumes:
      - ./airflow/database/:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always

  airflow-init:
    container_name: airflow_init
    build:
      context: ./airflow
      target: airflow
    command: poetry run scripts/airflow-init.sh
    env_file:
      - .env
      - ./airflow/.env.airflow
      - ./airflow/.env.postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/app/airflow/dags
      - ./airflow/data:/app/airflow/data
      - ./airflow/logs:/app/airflow/logs
    restart: "no"
  
  scheduler:
    container_name: airflow_scheduler
    build: 
      context: ./airflow
      target: airflow
    command: poetry run airflow scheduler
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "poetry run airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: 
      - .env
      - ./airflow/.env.airflow
    environment:
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://webserver:8080/execution/
      - AIRFLOW__DEBUG__FAIL_FAST=true
    volumes:
      - ./airflow/dags:/app/airflow/dags
      - ./airflow/data:/app/airflow/data
      - ./airflow/logs:/app/airflow/logs
      - $GCP_KEY_PATH:/app/airflow/keys/gcp-service-account.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    tty: true
    stdin_open: true

  dag-processor:
    container_name: airflow_dag_processor
    build:
      context: ./airflow
      target: airflow
    command: poetry run airflow dag-processor
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: 
      - .env
      - ./airflow/.env.airflow
    volumes:
      - ./airflow/dags:/app/airflow/dags
      - ./airflow/data:/app/airflow/data
      - ./airflow/logs:/app/airflow/logs
      - $GCP_KEY_PATH:/app/airflow/keys/gcp-service-account.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    tty: true
    stdin_open: true

  webserver:
    container_name: airflow_webserver
    build: 
      context: ./airflow
      target: airflow
    command: poetry run scripts/start-api.sh
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: 
        - path: ./airflow/.env.postgres
        - path: ./airflow/.env.airflow
    volumes:
      - ./airflow/dags:/app/airflow/dags
      - ./airflow/data:/app/airflow/data
      - ./airflow/logs:/app/airflow/logs
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    tty: true
    stdin_open: true

  dbt:
    container_name: dbt
    image: thelook-dbt:latest
    build: 
      context: ./dbt
      target: dbt
    profiles: ["tools"]
    volumes:
      - ./dbt:/app/dbt
      - $GCP_KEY_PATH:/app/keys/gcp-service-account.json:ro

  streamlit:
    container_name: streamlit
    build: ./app
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
